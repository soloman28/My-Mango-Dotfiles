[global]

exec = [ "swayosd-server", "/usr/lib/polkit-kde-authentication-agent-1", "XDG_MENU_PREFIX=arch- kbuildsycoca6", "systemd-inhibit --what=handle-power-key sleep infinity" ]
exec_once = [ "waybar", "wl-paste --type text --watch cliphist store &", "wl-clip-persist --clipboard regular --reconnect-tries 0 &",
              "swayidle -w timeout 600 'swaylock -f' timeout 900 'wlr-dpms off' before-sleep 'swaylock' after-resume 'wlr-dpms on' timeout 900 'systemctl suspend'",
              "awww-daemon", "swaync", "kdeconnect-indicator", "otd-daemon", "udev-block-notify", "bluetoothctl" ]
