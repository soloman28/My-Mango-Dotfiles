[bind.default]

# menu and terminal
"SUPER+t" = "spawn,$term"
"SUPER+d" = "spawn,rofi -show drun"

# kill or exit
"SUPER+m" = "quit"
"SUPER+q" = "killclient,"

# switch window focus
"SUPER+Tab" = "overcircle,next"
"SUPER+CTRL+Tab" = "togglejump"
"SUPER+shift+n" = "focusstack,next"
"SUPER+u" = "focuslast"
"SUPER+ALT+SHIFT+Left" = "focusdir,left"
"SUPER+ALT+SHIFT+Right" = "focusdir,right"
"SUPER+ALT+SHIFT+Up" = "focusdir,up"
"SUPER+ALT+SHIFT+Down" = "focusdir,down"

# swap window
"SUPER+SHIFT+Up" = "exchange_client,up"
"SUPER+SHIFT+Down" = "exchange_client,down"
"SUPER+SHIFT+Left" = "exchange_client,left"
"SUPER+SHIFT+Right" = "exchange_client,right"

# movewin
"SUPER+CTRL+SHIFT+Up" = "movewin,+0,-50"
"SUPER+CTRL+SHIFT+Down" = "movewin,+0,+50"
"SUPER+CTRL+SHIFT+Left" = "movewin,-50,+0"
"SUPER+CTRL+SHIFT+Right" = "movewin,+50,+0"

# resizewin
"CTRL+ALT+Up" = "resizewin,+0,-50"
"CTRL+ALT+Down" = "resizewin,+0,+50"
"CTRL+ALT+Left" = "resizewin,-50,+0"
"CTRL+ALT+Right" = "resizewin,+50,+0"

# switch window status
"SUPER+g" = "toggleglobal,"
"SUPER+v" = "togglefloating,"
"ALT+a" = "togglemaximizescreen,"
"ALT+f" = "togglefullscreen,"
"ALT+SHIFT+f" = "togglefakefullscreen,"
"SUPER+i" = "minimized,"
"SUPER+o" = "toggleoverlay,"
"SUPER+SHIFT+I" = "restore_minimized"
"ALT+z" = "toggle_scratchpad"

# scroller layout
"ALT+e" = "set_proportion,1.0"
"ALT+x" = "switch_proportion_preset,"
"alt+super+ctrl+Left" = "scroller_stack,left"
"alt+super+ctrl+Right" = "scroller_stack,right"
"alt+super+ctrl+Up" = "scroller_stack,up"
"alt+super+ctrl+Down" = "scroller_stack,down"

#dwindle layout
"alt+shift+Return" = "dwindle_toggle_split_direction"

# tile layout
"SUPER+shift+e" = "incnmaster,1"
"SUPER+shift+t" = "incnmaster,-1"
"ALT+s" = "zoom,"

# switch layout
"CTRL+SUPER+i" = "setlayout,tile"
"CTRL+SUPER+l" = "setlayout,scroller"
"SUPER+n" = "switch_layout"

# tag switch
"SUPER+Left" = "viewtoleft,0"
"CTRL+ALT+SHIFT+Left" = "viewtoleft_have_client,0"
"SUPER+Right" = "viewtoright,0"
"CTRL+ALT+SHIFT+Right" = "viewtoright_have_client,0"
"CTRL+SUPER+Left" = "tagtoleft,0"
"CTRL+SUPER+Right" = "tagtoright,0"
"Super+1" = "view,1,0"
"Super+2" = "view,2,0"
"Super+3" = "view,3,0"
"Super+4" = "view,4,0"
"Super+5" = "view,5,0"
"Super+6" = "view,6,0"
"Super+7" = "view,7,0"
"Super+8" = "view,8,0"
"Super+9" = "view,9,0"
"Alt+1" = "tag,1,0"
"Alt+2" = "tag,2,0"
"Alt+3" = "tag,3,0"
"Alt+4" = "tag,4,0"
"Alt+5" = "tag,5,0"
"Alt+6" = "tag,6,0"
"Alt+7" = "tag,7,0"
"Alt+8" = "tag,8,0"
"Alt+9" = "tag,9,0"
"ctrl+Super+1" = "toggletag,1"
"ctrl+Super+2" = "toggletag,2"
"ctrl+Super+3" = "toggletag,3"
"ctrl+Super+4" = "toggletag,4"
"ctrl+Super+5" = "toggletag,5"
"ctrl+Super+6" = "toggletag,6"
"ctrl+Super+7" = "toggletag,7"
"ctrl+Super+8" = "toggletag,8"
"ctrl+Super+9" = "toggletag,9"
"Alt+Shift+1" = "toggleview,1"
"Alt+Shift+2" = "toggleview,2"
"Alt+Shift+3" = "toggleview,3"
"Alt+Shift+4" = "toggleview,4"
"Alt+Shift+5" = "toggleview,5"
"Alt+Shift+6" = "toggleview,6"
"Alt+Shift+7" = "toggleview,7"
"Alt+Shift+8" = "toggleview,8"
"Alt+Shift+9" = "toggleview,9"

# monitor switch
"alt+shift+Left" = "focusmon,left"
"alt+shift+Right" = "focusmon,right"
"alt+shift+Up" = "focusmon,up"
"alt+shift+Down" = "focusmon,down"
"SUPER+Alt+Left" = "tagmon,left"
"SUPER+Alt+Right" = "tagmon,right"
"SUPER+Alt+Up" = "tagmon,up"
"SUPER+Alt+Down" = "tagmon,down"

# gaps
"ALT+SHIFT+X" = "incgaps,1"
"ALT+SHIFT+Z" = "incgaps,-1"
"ALT+SHIFT+R" = "togglegaps"

# brightness and volume
"XF86AudioRaiseVolume" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0"
"XF86AudioLowerVolume" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-"
"XF86AudioMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86AudioMicMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
"XF86MonBrightnessUp" = "spawn,brightnessctl --class=backlight set +10%"
"XF86MonBrightnessDown" = "spawn,brightnessctl --class=backlight set 10%-"

# media
"XF86AudioPlay" = "spawn,playerctl play-pause"
"XF86AudioStop" = "spawn,playerctl stop"
"XF86AudioPrev" = "spawn,playerctl previous"
"XF86AudioNext" = "spawn,playerctl next"

# custom app bind
"SUPER+SHIFT+b" = "spawn,waterfox"
"SUPER+e" = "spawn,dolphin"
"SUPER+CTRL+s" = "spawn_shell,$HOME/.config/mango/scripts/screenshot/freeze-region.sh"
"SUPER+SHIFT+s" = "spawn_shell,grim $HOME/Pictures/Screenshots/screenshot_$(date +%Y%m%d_%H%M%S).png && notify-send 'New screenshot!'"
"SUPER+x" = "spawn,sh ~/.config/rofi/powermenu.sh"

[bind.default.conflict]
"SUPER+r" = [
  # reload config
  "spawn_shell,notify-send 'config reload'",
  "reload_config",
]

[mousebind.default]

# Mouse Button Bindings
"SUPER+btn_left" = "moveresize,curmove"
"alt+btn_middle" = "set_proportion,0.5"
"SUPER+btn_right" = "moveresize,curresize"
"SUPER+CTRL+btn_left" = "minimized"
"SUPER+CTRL+btn_right" = "killclient"
"SUPER+CTRL+btn_middle" = "togglefullscreen"
"SUPER+btn_middle" = "togglemaximizescreen,0"

[axisbind.default]

# Axis Bindings
"SUPER+UP" = "viewtoleft_have_client"
"SUPER+DOWN" = "viewtoright_have_client"
"alt+UP" = "focusdir,left"
"alt+DOWN" = "focusdir,right"
"shift+super+UP" = "exchange_client,left"
"shift+super+DOWN" = "exchange_client,right"

[gesturebind.default]

# Gesturebind
"none+left+3" = "focusdir,left"
"none+right+3" = "focusdir,right"
"none+up+3" = "focusdir,up"
"none+down+3" = "focusdir,down"
"none+right+4" = "viewprev_have_client"
"none+left+4" = "viewnext_have_client"
"none+up+4" = "enteroverview"
"none+down+4" = "leaveoverview"
